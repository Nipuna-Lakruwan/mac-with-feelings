name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: swift test
      - name: Build the app bundle
        run: scripts/build-app.sh
      - uses: actions/upload-artifact@v7
        with:
          name: MacWithFeelings
          path: build/MacWithFeelings.zip
